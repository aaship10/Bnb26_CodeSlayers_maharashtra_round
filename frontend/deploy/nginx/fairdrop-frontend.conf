# Fair Drop: frontend + routing for nginx on :8080 (proposed by D; B owns infra/ and merges this).
#
#   /api/*   -> backend, /api prefix stripped      (A)
#   /sim/*   -> simulator service, path kept       (C, port 8100)
#   /*       -> the static SPA built by `npm run build` (frontend/dist), with SPA fallback
#
# Tested on nginx 1.28 against the mock server with the full Playwright suite (see deploy/README.md).
# Upstream addresses below are placeholders for docker-compose service names.

upstream fd_api {
    server api:8000;          # B: one line per backend replica
    keepalive 64;
}

upstream fd_sim {
    server simulator:8100;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;   # contents of frontend/dist
    index index.html;

    include fd-security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---- live updates: Server-Sent Events must not be buffered or cut ------
    location ~ ^/api/events/[^/]+/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://fd_api;
        include fd-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        include fd-security-headers.conf;
    }

    location ~ ^/sim/runs/[^/]+/stream$ {
        proxy_pass http://fd_sim;
        include fd-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
        include fd-security-headers.conf;
    }

    # ---- APIs ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://fd_api/;        # trailing slash strips the /api prefix
        include fd-proxy.conf;
        proxy_read_timeout 30s;
    }

    location /sim/ {
        proxy_pass http://fd_sim;         # no slash: /sim/... is passed through unchanged
        include fd-proxy.conf;
        proxy_read_timeout 30s;
    }

    # The mock's control endpoints must never be reachable in a real deployment.
    location /__mock/ {
        return 404;
    }

    # ---- static assets: hashed file names, cache forever ---------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include fd-security-headers.conf;
    }

    # ---- the SPA: deep links (/events/x/status) fall back to index.html -----
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";   # always pick up a new build
        include fd-security-headers.conf;
    }
}
