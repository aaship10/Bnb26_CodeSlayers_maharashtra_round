# Included in the server block AND in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location adds one).
#
# CSP notes:
#  - script-src 'self': no inline scripts or eval in the build; workers are same-origin files.
#  - style-src 'unsafe-inline': React sets style attributes (progress widths, chart colours).
#  - A hosted CAPTCHA provider (B8) will need its script/frame origins added here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
