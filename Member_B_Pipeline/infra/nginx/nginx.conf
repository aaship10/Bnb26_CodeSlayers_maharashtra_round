# Fair Drop edge: main nginx config TEMPLATE. `infra/local/run.py up --edge nginx` renders it (replica list, paths,
# optional simulation key) into .local/nginx/conf/ and runs the nginx 1.28 build fetched by get_nginx.py.
# Verified with `nginx -t` and exercised by the full live suite through it (docs/EDGE.md).
# __PLACEHOLDERS__ are filled in by the renderer; everything else is final.
worker_processes 1;                   # the Windows build of nginx runs a single worker
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;          # copied next to the rendered config
    default_type  application/octet-stream;

    log_format fd '$remote_addr "$request" $status rt=$request_time urt=$upstream_response_time up=$upstream_addr '
                  'cache=$upstream_cache_status ua="$http_user_agent"';
    access_log logs/access.log fd;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # --- edge rate limiting: GENEROUS on purpose ---------------------------------------------------
    # A campus NAT puts thousands of legitimate students behind one address, so the edge only has to stop absurd
    # floods; the precise per-identity limits are the app's (Redis). A request carrying the simulation key (only
    # rendered into this file when SIMULATION_MODE is on) gets an EMPTY key, which nginx does not count: Member C's
    # load generator must not be throttled as "one IP".
    map_hash_bucket_size 128;          # the default (32) cannot hold the 48-character simulation key: found by running it
    map $http_x_sim_key $fd_limit_key {
        default $binary_remote_addr;
        __SIM_KEY_MAP__
    }
    limit_req_zone  $fd_limit_key zone=fd_req:20m  rate=__EDGE_RATE__r/s;
    limit_conn_zone $fd_limit_key zone=fd_conn:20m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- 1 s microcache for the public GETs ----------------------------------------------------------
    # Caveat versus the dev gateway: nginx cannot refresh `server_now` inside a cached body, so a cache HIT may
    # carry a clock up to 1 s old (harmless for fairness: arrival time is irrelevant to the lottery; it only skews a
    # countdown by <= 1 s).
    proxy_cache_path cache/fd_micro levels=1:2 keys_zone=fd_micro:10m max_size=64m inactive=10s use_temp_path=off;

    # Static replica list rendered from .local/run/replicas. Passive health only (open-source nginx has no active
    # checks): a refused connection takes the replica out for fail_timeout and the request is retried on the next
    # one (nothing was sent, so that is safe for every method). Draining replicas keep serving through their grace
    # period, so nothing is lost before they stop accepting.
    upstream fd_api {
        __UPSTREAM_API__
        keepalive 32;
    }
    upstream fd_sim {
        server 127.0.0.1:8100;
        keepalive 8;
    }
    upstream fd_ops {                  # the dev gateway keeps serving /ops/ (aggregated metrics + dashboard)
        server 127.0.0.1:__OPS_PORT__;
    }

    include fairdrop.conf;
}
