# Common proxy settings for /api and /sim (merged from Member D's proposal).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx is the edge, so OVERWRITE forwarding headers with the real peer; never append to a client-supplied value.
# (D's proposal used $proxy_add_x_forwarded_for; the app's right-to-left parsing would cope, but overwriting is
# stricter.) Behind a CDN/LB use ngx_http_realip_module instead.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
# proxy_read_timeout is set per location (15-30 s for requests, 1 h for streams).
