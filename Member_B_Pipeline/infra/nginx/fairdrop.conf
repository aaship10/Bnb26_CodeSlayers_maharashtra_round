# One origin on :__LISTEN__  (TEMPLATE; see nginx.conf). Merges Member D's frontend config with Member B's edge rules.
#   /api/*  -> backend replicas (prefix stripped)       /sim/* -> simulator (path kept)
#   /ops/   -> dev gateway (ops dashboard)              else   -> the built frontend, SPA fallback
# Regex locations are matched before the generic /api/ prefix, so each rule below wins for its URLs.

server {
    listen 127.0.0.1:__LISTEN__;
    server_name _;

    root  __FRONTEND_ROOT__;           # frontend/dist
    index index.html;

    include fd-security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 429 in the shared error contract for limit_req / limit_conn rejections.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"code":"RATE_LIMITED","message":"too many requests","details":{"retry_after_ms":1000,"scope":"ip"}}';
    }

    # nginx's own gateway errors (every replica down, simulator not running, connect/read timeout) would otherwise be
    # an HTML page; the app's errors are untouched (proxy_intercept_errors is off). Retryable by the client.
    error_page 502 503 504 = @upstream_unavailable;
    location @upstream_unavailable {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"code":"INTERNAL","message":"service temporarily unavailable","details":{"reason":"upstream_unavailable","retry_after_ms":2000}}';
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metrics are scraped from each replica directly; the public origin must never expose them.
    location = /api/metrics {
        return 404;
    }

    # ---- live updates: SSE must not be buffered, cut, or retried --------------------------------------------
    location ~ ^/api/events/[^/]+/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://fd_api;
        include fd-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A stream that never started (refused connection, or 503 from a draining replica) is safe to retry on another
        # replica: nothing was sent to the client yet. Once data has flowed it is never retried.
        proxy_next_upstream error timeout http_503;
        proxy_next_upstream_tries 3;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
        add_header X-Upstream $upstream_addr always;
        include fd-security-headers.conf;
        limit_req zone=fd_req burst=__EDGE_BURST__ nodelay;
    }

    location ~ ^/sim/runs/[^/]+/stream$ {
        proxy_pass http://fd_sim;
        include fd-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no always;
        include fd-security-headers.conf;
    }

    # ---- public GETs: 1 s microcache, one upstream request per key (cache lock) ----------------------------
    location ~ ^/api/events(/[^/]+)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://fd_api;
        include fd-proxy.conf;
        proxy_read_timeout 15s;
        proxy_cache fd_micro;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_methods GET HEAD;
        add_header X-Cache $upstream_cache_status always;
        add_header X-Upstream $upstream_addr always;
        include fd-security-headers.conf;
        limit_req zone=fd_req burst=__EDGE_BURST__ nodelay;
        limit_conn fd_conn 200;
    }

    # ---- /enter and /claim: the ONLY writes nginx may replay after a failure ---------------------------------
    # Both are idempotent by contract (/enter: one entry per identity; /claim: Idempotency-Key is required).
    # `non_idempotent` opts these two in; everything else (e.g. /auth/register) is never replayed after it was sent.
    location ~ ^/api/events/[^/]+/(enter|claim)$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://fd_api;
        include fd-proxy.conf;
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 15s;
        add_header X-Upstream $upstream_addr always;
        include fd-security-headers.conf;
        limit_req zone=fd_req burst=__EDGE_BURST__ nodelay;
        limit_conn fd_conn 200;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://fd_api;
        include fd-proxy.conf;
        proxy_read_timeout 30s;
        add_header X-Upstream $upstream_addr always;
        include fd-security-headers.conf;
        limit_req zone=fd_req burst=__EDGE_BURST__ nodelay;
        limit_conn fd_conn 200;
        # default `proxy_next_upstream error timeout`: a refused connection is retried on another replica
        # (nothing was sent); a POST that WAS sent is not replayed.
    }

    location /sim/ {
        proxy_pass http://fd_sim;          # no slash: /sim/... is passed through unchanged
        include fd-proxy.conf;
        proxy_read_timeout 30s;
    }

    # Ops dashboard + aggregated metrics (admin token enforced by the dev gateway). Inline script: no CSP include.
    location /ops/ {
        proxy_pass http://fd_ops;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }

    # The mock's control endpoints must never be reachable in a real deployment.
    location /__mock/ {
        return 404;
    }

    # ---- static assets: hashed file names, cache forever ----------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include fd-security-headers.conf;
    }

    # ---- the SPA: deep links (/events/x/status) fall back to index.html -------------------------------------
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";   # always pick up a new build
        include fd-security-headers.conf;
    }
}
