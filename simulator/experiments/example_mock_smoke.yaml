# Example scenario. In Stage 1 it is only checked for shape; the runner arrives in Stage 5.
name: example_mock_smoke
description: Small lottery scenario with a speed-bot flood and a single-IP Sybil, against the MOCK target.
target: mock
seed: 20261101
repeats: 3
event:
  inventory: 100
  window_seconds: 30
  claim_ttl_seconds: 20
  mode: LOTTERY
  defences: {preset: none}
legit:
  count: 2000
  arrival: {kind: spike_tail, spike_fraction: 0.6, spike_window_fraction: 0.05}
  nat_groups: {fraction: 0.1, group_size: 50}
attackers:
  - profile: speed_bot
    identities: 20
    rps_per_identity: 50
  - profile: sybil_single_ip
    identities: 200
    ips: 1
load:
  max_in_flight: 500
  procs: 1
auth_mode: dev_header
