# Stage 3 development check: lottery, small crowd, three attacker profiles, MOCK target.
name: attack_small_mock
description: FCFS-style flood + single-IP Sybil + distributed botnet against a 100-seat lottery.
target: mock
seed: 20261004
repeats: 3
event:
  inventory: 100
  window_seconds: 10
  claim_ttl_seconds: 5
  mode: LOTTERY
  defences: {preset: none}
legit:
  count: 2000
  arrival: {kind: spike_tail, spike_fraction: 0.6, spike_window_fraction: 0.05}
  nat_groups: {fraction: 0.1, group_size: 50}
  poll: {interval_s_mean: 2, max_polls: 10}
  claim: {delay_lognormal_mu: 0.0, delay_lognormal_sigma: 0.5, no_show_rate: 0.05}
attackers:
  - {profile: speed_bot, identities: 1, ips: 1, rps_per_identity: 50}
  - {profile: sybil_single_ip, identities: 300, ips: 1, rps_per_identity: 2}
  - {profile: distributed_botnet, identities: 300, ips: 100, rps_per_identity: 2}
load:
  max_in_flight: 500
  procs: 1
  lead_s: 3
auth_mode: dev_header
