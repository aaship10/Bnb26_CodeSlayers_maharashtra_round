# Stage 2 development baseline: 2,000 legit users, no attack, MOCK target. ~25 s.
name: baseline_small_mock
description: Small-scale flash crowd, no attackers, lottery, no defences. Development check of the load engine.
target: mock
seed: 20261004
repeats: 3
event:
  inventory: 100
  window_seconds: 10
  claim_ttl_seconds: 5
  mode: LOTTERY
  defences: {preset: none}
legit:
  count: 2000
  arrival: {kind: spike_tail, spike_fraction: 0.6, spike_window_fraction: 0.05}
  nat_groups: {fraction: 0.1, group_size: 50}
  poll: {interval_s_mean: 2, max_polls: 10}
  claim: {delay_lognormal_mu: 0.0, delay_lognormal_sigma: 0.5, no_show_rate: 0.05}
load:
  max_in_flight: 500
  procs: 1
  lead_s: 3
auth_mode: dev_header
