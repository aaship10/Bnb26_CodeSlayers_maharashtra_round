[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairdrop-sim"
version = "0.1.0"
description = "Fair Drop simulator, load engine, experiment runner and evidence (Member C)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "hdrhistogram>=0.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
fdsim = "fairdrop_sim.cli:main"

[tool.setuptools.packages.find]
include = ["fairdrop_sim*", "mock_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
